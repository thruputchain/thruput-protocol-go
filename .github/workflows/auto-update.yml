name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-protocol
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Credentials are not persisted: only the push below needs to write, and
      # it authenticates for that one command. The protocol source is public
      # and read anonymously over HTTPS.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Update protocol submodule to latest main
        run: |
          git submodule update --init protocol
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # go.mod pins goxdr, and generating with any other version reshuffles
      # generated.go wholesale, so install exactly what the module requires
      # rather than @latest.
      - name: Install goxdr
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/xdrpp/goxdr)
          echo "-- Installing goxdr ${version} --"
          go install "github.com/xdrpp/goxdr/cmd/goxdr@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Rewrites pkg.go, generated.go and hogp.go, then runs go mod tidy,
      # go generate and go build. Nothing here is hand-written.
      - name: Regenerate
        run: ./build.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The push and the `gh` commands below must NOT use GITHUB_TOKEN: a push
      # or merge performed by it starts no workflow runs, so CI would never
      # report on the bump and notify-consumers would never fire, leaving
      # thruput-go behind. PROTOCOL_GO_AUTO_UPDATE_PAT is scoped to this
      # repository alone and needs only Contents: write (the push) and Pull
      # requests: write (the PR and its auto-merge).
      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short HEAD)
          BRANCH="auto-update/protocol"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add -A
          # commit.sh writes "bump to protocol@<short-sha>", the same message
          # the manual bump-thruput-go path produces.
          ./commit.sh
          # The token goes in this one command's URL; it is not written to git
          # config, and Actions masks it in the log.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/thruputchain/thruput-protocol-go.git" "HEAD:refs/heads/${BRANCH}"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            # --head because the push above set no upstream for gh to infer
            # the branch from.
            gh pr create \
              --head "$BRANCH" \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: thruputchain/thruput-protocol@${PROTOCOL_SHA}" || true
          fi

          # Auto-merge completes as whoever enabled it, so enabling it with a
          # token other than GITHUB_TOKEN is what lets the merge commit start
          # notify-consumers.
          gh pr merge "$BRANCH" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.PROTOCOL_GO_AUTO_UPDATE_PAT }}
