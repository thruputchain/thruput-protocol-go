name: Auto-update protocol

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-update-protocol
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The retained repository write key pushes branches and triggers CI.
      # The protocol source is read with a separate Contents-only App token.
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROTOCOL_GO_TO_SELF_WRITE_KEY }}

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ssh-key: ${{ secrets.PROTOCOL_GO_TO_SELF_WRITE_KEY }}

      - name: Generate protocol read token
        id: protocol-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-protocol
          permission-contents: read

      - name: Update protocol submodule to latest main
        env:
          GH_TOKEN: ${{ steps.protocol-token.outputs.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GH_TOKEN}@github.com/thruputchain/thruput-protocol.git".insteadOf \
            "git@github.com:thruputchain/thruput-protocol.git"
          git submodule update --init protocol
          git -C protocol fetch origin main
          git -C protocol checkout origin/main

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # go.mod pins goxdr, and generating with any other version reshuffles
      # generated.go wholesale, so install exactly what the module requires
      # rather than @latest.
      - name: Install goxdr
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/xdrpp/goxdr)
          echo "-- Installing goxdr ${version} --"
          go install "github.com/xdrpp/goxdr/cmd/goxdr@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Rewrites pkg.go, generated.go and hogp.go, then runs go mod tidy,
      # go generate and go build. Nothing here is hand-written.
      - name: Regenerate
        run: ./build.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Protocol submodule already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The `gh` commands below must NOT use GITHUB_TOKEN, for the same reason
      # the push above does not: a merge performed by it starts no workflow
      # runs, so notify-consumers never fires and groundhog-go falls behind.
      # A deploy key cannot stand in here -- it authenticates git, not the API.
      # PROTOCOL_GO_AUTO_UPDATE_PAT is scoped to this repository alone and
      # needs only Contents: write and Pull requests: write.
      - name: Commit and open PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          PROTOCOL_SHA=$(git -C protocol rev-parse --short HEAD)
          BRANCH="auto-update/protocol"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:thruputchain/thruput-protocol-go.git

          git checkout -b "$BRANCH"
          git add -A
          # commit.sh writes "bump to protocol@<short-sha>", the same message
          # the manual bump-groundhog-go path produces.
          ./commit.sh
          git push -f -u origin "$BRANCH"

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing PR: $EXISTING_PR"
          else
            gh pr create \
              --title "Auto-update protocol to ${PROTOCOL_SHA}" \
              --body "Automated protocol submodule bump and regeneration.

          Protocol: thruputchain/thruput-protocol@${PROTOCOL_SHA}" || true
          fi

          # Auto-merge completes as whoever enabled it, so enabling it with a
          # token other than GITHUB_TOKEN is what lets the merge commit start
          # notify-consumers.
          gh pr merge "$BRANCH" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.PROTOCOL_GO_AUTO_UPDATE_PAT }}
