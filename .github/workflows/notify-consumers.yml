name: Notify consumers

on:
  push:
    branches: [main]
  # Manual escape hatch, kept for catching thruput-go up by hand.
  #
  # The push trigger above used to be inert for the commits that mattered
  # most: auto-update merged its PR with GITHUB_TOKEN, and a merge performed
  # by it starts no workflow runs. That merge now uses a token scoped to this
  # repository, so protocol bumps reach this workflow on their own.
  workflow_dispatch:

# Nothing here uses GITHUB_TOKEN -- the dispatch below authenticates with an
# App installation token -- so it needs no permissions of its own.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      # Mirrors protocol's own notify workflow, which dispatches to this
      # repository the same way. Pinned to a commit SHA rather than the v3
      # tag because this step receives the App private key.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PROTOCOL_SYNCHRONIZER_APP_ID }}
          private-key: ${{ secrets.PROTOCOL_SYNCHRONIZER_SECRET_KEY }}
          owner: thruputchain
          repositories: thruput-go
          permission-actions: write

      # Fires on every push to main, not only the auto-update bumps.
      # thruput-go pins this repository by commit, so any main commit is a
      # real pointer move for it, and its own workflow no-ops when there is
      # nothing to bump.
      #
      # This does not loop: thruput-go notifies nobody. Its pointer in hogd
      # is still moved by hand.
      - name: Trigger thruput-go auto-update
        run: |
          gh workflow run auto-update.yml \
            --repo thruputchain/thruput-go \
            --ref main
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
