name: CI

on:
  push:
    # auto-update/protocol is the synchronizer's branch. CI has to report on
    # it directly: its PR is opened with auto-merge already on, so the checks
    # must land against the branch head, not only at review time.
    branches: ["main", "auto-update/protocol"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # build.sh reads protocol/*.x, so the submodule is not optional here.
      # thruput-protocol is public and pinned by an HTTPS URL, so this needs
      # no credentials and runs the same for pull requests from forks.
      - name: Check out the protocol submodule
        run: git submodule update --init protocol

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # go.mod pins goxdr, and generating with any other version reshuffles
      # generated.go wholesale (protocol-go#16), so install exactly what the
      # module requires rather than @latest.
      - name: Install goxdr
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/xdrpp/goxdr)
          echo "-- Installing goxdr ${version} --"
          go install "github.com/xdrpp/goxdr/cmd/goxdr@${version}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Regenerates from the pinned protocol submodule and fails if the
      # committed pkg.go / generated.go / hogp.go differ from what build.sh
      # produces -- the check that a bump PR actually matches its submodule.
      - name: Check generated bindings are up to date
        run: ./build.sh --check

      - name: Test
        run: GOWORK=off go test ./...

      # A bare `go vet` flags unkeyed composite literals throughout goxdr's
      # output; protocol's own CI passes -composites=false for the same reason.
      - name: Vet
        run: go vet -composites=false ./...
